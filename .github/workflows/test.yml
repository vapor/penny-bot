name: tests
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request: { types: [opened, reopened, synchronize, ready_for_review] }
  push: { branches: [main] }

jobs:
  unit-tests:
    permissions:
      contents: read
    uses: vapor/ci/.github/workflows/run-unit-tests.yml@main
    with:
      with_release_mode_testing: true
      with_coverage: false
      with_tsan: false
      with_api_check: false
      with_linting: true
      extra_flags: "--disable-experimental-prebuilts --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable"

  terraform-lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2

      - name: Lint
        env:
          # so tflint --init can dodge GH API rate limits by using this token
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./scripts/tf-check.sh

  terraform-plan:
    # Forks cannot mint an OIDC token, so they would only fail at the credentials step.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.PENNY_OIDC_PLAN_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Terraform plan
        working-directory: infra
        env:
          # A hack to skip using a profile in CI, to use OIDC instead
          TF_VAR_aws_profile: ""
        run: |
          terraform init -input=false -backend-config="profile="
          terraform plan -input=false -lock=false
