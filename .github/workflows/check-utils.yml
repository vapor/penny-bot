name: check-utils
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request: { types: [opened, reopened, synchronize, ready_for_review] }
  push: { branches: [main] }
  schedule:
    - cron: "0 6 * * 1"

defaults:
  run:
    shell: bash --noprofile --norc -Eeuo pipefail {0}

jobs:
  check-utils:
    permissions:
      contents: read

    runs-on: ubuntu-latest

    container: swift:6.3-noble

    timeout-minutes: 10

    steps:
      - name: Check out ${{ github.event.repository.name }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure git
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Run utility scripts
        env:
          # so the script can dodge GH API rate limits by using this token
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "- Running NewCodable Sync..."
          swift utils/NewCodableSync.swift

      - name: Apply patches
        run: |
          shopt -s failglob
          for patch in utils/patches/*.patch; do
            printf '%s\n' "- Applying ${patch}..."
            git apply "${patch}"
          done

      - name: Check for modifications
        id: check-modifications
        run: |
          MODIFICATIONS="$(git status --porcelain)"
          if [[ -n "${MODIFICATIONS}" ]]; then
            printf '%s\n' "has-modifications=true" >> "${GITHUB_OUTPUT}"
          else
            printf '%s\n' "has-modifications=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Show diff if modifications detected
        if: steps.check-modifications.outputs.has-modifications == 'true'
        run: |
          {
            printf '%s\n' "## Utils Check Failed ❌"
            printf '%s\n' ""
            printf '%s\n' "**Vendored files are out of date. Please run the utility scripts and commit the changes.**"
            printf '%s\n' ""
            printf '%s\n' "### Diff:"
            printf '%s\n' '```diff'
            git diff --stat
            printf '%s\n' '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail if has modifications
        if: steps.check-modifications.outputs.has-modifications == 'true'
        run: exit 1
